name: CI

permissions:
  contents: read

# 闭掉 OG-F-26 / OG-O-14「无 CI」：每次 push / PR 自动跑代码级门禁。
# 数据库（*.db）全部 gitignore，CI 现场用 data/generate_example_db.py 生成可复现示例库；
# 依赖私有省份库的检查（数据完整性 / 视图新鲜度）属发版本地环节，由 --ci 跳过。

on:
  push:
    branches: [ main, master ]
  pull_request:
  schedule:
    # 每周一 03:17（北京时间；周日 19:17 UTC），避开整点拥堵。
    - cron: '17 19 * * 0'

jobs:
  gate:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pytest

      - name: 生成示例库（可复现·无私有数据）
        run: python data/generate_example_db.py

      - name: 数据门禁逻辑自检（在示例库上跑科类门禁 + 视图新鲜度）
        # OG-F-42: --ci 会跳过依赖私有省份库的检查，导致科类标签门禁/视图新鲜度在 CI 完全不跑
        # （恰是数据/科类回归最易复发处）。这里用示例库现造一个 province，跑全套（非 --ci）验证门禁逻辑本身。
        run: |
          cp data/example.db data/ci_example_gaokao.db
          python scripts/create_views.py --province ci_example
          python scripts/post_import_validation.py --province ci_example --quick
          rm -f data/ci_example_gaokao.db

      - name: 发版门禁（CI 模式）
        # 语法 + pytest + 真实 Flask/Web/API 进程（显式 example 源）+ 隐私 + 当前许可全表面
        run: python scripts/verify_release.py --ci

      - name: 缺少仓库外发布凭据必须失败关闭
        shell: bash
        run: |
          set +e
          output="$(python scripts/verify_release.py --ci --public-release 2>&1)"
          status=$?
          set -e
          printf '%s\n' "$output"
          test "$status" -eq 1
          grep -F '缺少 --release-approval' <<<"$output"
